<!DOCTYPE html>
<!--
  Source for assets/og/default.png, the link-preview image (1200x630).
  Regenerate after editing:
    chromium --headless=new --hide-scrollbars --window-size=1200,630 \
      --screenshot=assets/og/default.png scripts/og/card.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: #e9ecf1;
    background:
      radial-gradient(900px 600px at 90% -10%, rgba(94,225,255,0.18), transparent),
      radial-gradient(700px 500px at 0% 110%, rgba(179,136,255,0.16), transparent),
      #0a0b0e;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
  }
  .mark { width: 88px; height: 88px; margin-bottom: 40px; }
  h1 { font-size: 84px; font-weight: 800; letter-spacing: -2px; margin: 0; line-height: 1; }
  p { font-size: 34px; color: #a3aab8; margin: 22px 0 0; max-width: 900px; line-height: 1.3; }
  .bar { height: 6px; width: 160px; border-radius: 3px; margin-top: 44px; background: linear-gradient(90deg, #5ee1ff, #b388ff); }
  .url { position: absolute; right: 96px; bottom: 64px; font-size: 26px; color: #5ee1ff; font-weight: 600; }
</style>
</head>
<body>
  <img class="mark" src="../../assets/icons/favicon.svg" alt="">
  <h1>Chaz Merritt</h1>
  <p>Machine learning for forest biometrics and timber forecasting · University of Georgia</p>
  <div class="bar"></div>
  <div class="url">chazmerritt.com</div>
</body>
</html>
